services:
  - type: web
    name: taxi-backend
    env: python
    region: frankfurt # Yevropa serveri tezroq ishlaydi
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migratsiya avval, keyin server (aks holda yangi maydonlar uchun xato bo'ladi)
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        value: placeholder_tugri_qiling
      - key: DRIVERS_GROUP_ID
        value: "0" # Haydovchilar guruhi IDsi, alishtiring
      - key: ADMIN_TELEGRAM_IDS
        value: "" # Comma separated telegram id'lar: 123456,7891011
      - key: DATABASE_URL
        value: postgresql+asyncpg://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: BACKEND_URL
        value: https://taxi-backend.onrender.com
      - key: FRONTEND_URL
        value: https://taxi-frontend.onrender.com
      - key: SECRET_KEY
        generateValue: true # Render o'zi random secret generatsiya qiladi
      # initData muddati (replay himoyasi)
      - key: INITDATA_MAX_AGE_SECONDS
        value: "86400"
      # Rate limiting
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "20"
      # Buyurtma muddati (fon ishlaydigan tekshiruv)
      - key: ORDER_EXPIRY_JOB_ENABLED
        value: "true"
      - key: ORDER_EXPIRY_INTERVAL_SECONDS
        value: "300"
      # Komissiya narxlari
      - key: COMMISSION_1_PAX
        value: "5000"
      - key: COMMISSION_2_PAX
        value: "8000"
      - key: COMMISSION_3_PAX
        value: "12000"
      - key: COMMISSION_4_PAX
        value: "15000"
      - key: COMMISSION_5_PLUS_PAX
        value: "25000"
      # Logging
      - key: LOG_LEVEL
        value: INFO
